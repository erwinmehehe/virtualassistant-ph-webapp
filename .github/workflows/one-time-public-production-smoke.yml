name: One-time public production smoke

on:
  push:
    branches: [ops/public-production-smoke]
    paths:
      - ".github/workflows/one-time-public-production-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check public production routes and pricing
        shell: bash
        run: |
          set -euo pipefail
          base="https://virtualassistant.com.ph"
          check() {
            path="$1"
            marker="$2"
            body="$(mktemp)"
            code="$(curl --fail-with-body --silent --show-error --location --max-time 30 -o "$body" -w '%{http_code}' "$base$path")"
            echo "$path -> HTTP $code"
            test "$code" = "200"
            grep -Fq "$marker" "$body" || { echo "Missing marker on $path: $marker"; head -c 1000 "$body"; exit 1; }
          }
          check "/" "Get your free VA match"
          check "/pricing" "Virtual Assistant pricing, without hidden fees."
          check "/hire" "Virtual Assistant"
          check "/services" "Virtual Assistant"
          check "/about" "A recruiting team for businesses hiring Filipino Virtual Assistants."
          check "/blog" "Build a better remote team, one clear workflow at a time."
          check "/book-client-call" "Virtual Assistant"

          pricing="$(mktemp)"
          curl --fail-with-body --silent --show-error --location --max-time 30 "$base/pricing" -o "$pricing"
          grep -Fq '20%' "$pricing" || { echo 'Live pricing page is missing the canonical 20% managed margin.'; exit 1; }
          grep -Fq '$150' "$pricing" || { echo 'Live pricing page is missing the canonical $150 placement fee.'; exit 1; }
          grep -Fq 'USD 5/hour' "$pricing" || { echo 'Live pricing page is missing the canonical USD 5/hour minimum compensation.'; exit 1; }

          home="$(mktemp)"
          curl --fail-with-body --silent --show-error --location --max-time 30 "$base/" -o "$home"
          if grep -Fq 'USD 6/hour' "$home"; then
            echo 'Homepage still exposes stale USD 6/hour pricing.'
            exit 1
          fi
          echo "Public production routes and canonical pricing passed."
