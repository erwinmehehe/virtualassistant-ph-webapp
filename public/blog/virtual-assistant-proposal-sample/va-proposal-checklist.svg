<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Virtual Assistant proposal pre-send checklist</title>
<desc id="desc">A proposal checklist covering relevance, evidence, truthful claims, schedule fit, portfolio access and proofreading.</desc>
<rect width="960" height="600" rx="32" fill="#eef2ff"/>
<text x="60" y="70" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#101828">Before you click send</text>
<text x="60" y="104" font-family="Arial, sans-serif" font-size="15" fill="#667085">Six checks for a credible VA application.</text>
<g font-family="Arial, sans-serif">
<rect x="60" y="146" width="390" height="112" rx="20" fill="#fff"/><circle cx="96" cy="183" r="17" fill="#444ce7"/><path d="M88 183l5 5 10-12" fill="none" stroke="#fff" stroke-width="3"/><text x="126" y="181" font-size="17" font-weight="700" fill="#101828">Relevant opening</text><text x="126" y="207" font-size="14" fill="#667085">It clearly refers to this job.</text>
<rect x="510" y="146" width="390" height="112" rx="20" fill="#fff"/><circle cx="546" cy="183" r="17" fill="#7a5af8"/><path d="M538 183l5 5 10-12" fill="none" stroke="#fff" stroke-width="3"/><text x="576" y="181" font-size="17" font-weight="700" fill="#101828">Real proof</text><text x="576" y="207" font-size="14" fill="#667085">Every example can be defended.</text>
<rect x="60" y="282" width="390" height="112" rx="20" fill="#fff"/><circle cx="96" cy="319" r="17" fill="#12b76a"/><path d="M88 319l5 5 10-12" fill="none" stroke="#fff" stroke-width="3"/><text x="126" y="317" font-size="17" font-weight="700" fill="#101828">Schedule fit</text><text x="126" y="343" font-size="14" fill="#667085">Hours and timezone claims are true.</text>
<rect x="510" y="282" width="390" height="112" rx="20" fill="#fff"/><circle cx="546" cy="319" r="17" fill="#f79009"/><path d="M538 319l5 5 10-12" fill="none" stroke="#fff" stroke-width="3"/><text x="576" y="317" font-size="17" font-weight="700" fill="#101828">Useful evidence</text><text x="576" y="343" font-size="14" fill="#667085">The portfolio link matches the role.</text>
<rect x="60" y="418" width="390" height="112" rx="20" fill="#fff"/><circle cx="96" cy="455" r="17" fill="#0284c7"/><path d="M88 455l5 5 10-12" fill="none" stroke="#fff" stroke-width="3"/><text x="126" y="453" font-size="17" font-weight="700" fill="#101828">Easy reply</text><text x="126" y="479" font-size="14" fill="#667085">One specific next question.</text>
<rect x="510" y="418" width="390" height="112" rx="20" fill="#fff"/><circle cx="546" cy="455" r="17" fill="#344054"/><path d="M538 455l5 5 10-12" fill="none" stroke="#fff" stroke-width="3"/><text x="576" y="453" font-size="17" font-weight="700" fill="#101828">Final QA</text><text x="576" y="479" font-size="14" fill="#667085">Names, links and spelling checked.</text>
</g>
</svg>