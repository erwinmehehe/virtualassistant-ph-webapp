name: One-time full dependency audit

on:
  push:
    branches: [ops/verify-security-and-production-smoke]
    paths:
      - ".github/workflows/one-time-full-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full audit detail
        run: npm audit --audit-level=high
