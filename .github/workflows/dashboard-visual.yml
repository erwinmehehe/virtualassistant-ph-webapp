name: Authenticated dashboard visual QA

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/app/workspace/**"
      - "src/app/dashboard-premium.css"
      - "src/components/app-*.tsx"
      - "src/components/dash-*.tsx"
      - "src/components/sales-analytics-dashboard.tsx"
      - "src/lib/sales-analytics.ts"
      - "scripts/authenticated-dashboard-visual.mjs"
      - ".github/workflows/dashboard-visual.yml"

permissions:
  contents: read
  deployments: read

concurrency:
  group: dashboard-visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshots:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMOKE_SUPABASE_URL: ${{ secrets.SMOKE_SUPABASE_URL }}
      SMOKE_SUPABASE_ANON_KEY: ${{ secrets.SMOKE_SUPABASE_ANON_KEY }}
      SMOKE_CLIENT_EMAIL: ${{ secrets.SMOKE_CLIENT_EMAIL }}
      SMOKE_CLIENT_PASSWORD: ${{ secrets.SMOKE_CLIENT_PASSWORD }}
      SMOKE_VA_EMAIL: ${{ secrets.SMOKE_VA_EMAIL }}
      SMOKE_VA_PASSWORD: ${{ secrets.SMOKE_VA_PASSWORD }}
      SMOKE_RECRUITER_EMAIL: ${{ secrets.SMOKE_RECRUITER_EMAIL }}
      SMOKE_RECRUITER_PASSWORD: ${{ secrets.SMOKE_RECRUITER_PASSWORD }}
      SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
      SMOKE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SMOKE_SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SMOKE_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SMOKE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SMOKE_SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check visual test credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$SMOKE_SUPABASE_URL" && -n "$SMOKE_SUPABASE_ANON_KEY" && -n "$SMOKE_SUPABASE_SERVICE_ROLE_KEY" && -n "$SMOKE_CLIENT_EMAIL" && -n "$SMOKE_CLIENT_PASSWORD" && -n "$SMOKE_VA_EMAIL" && -n "$SMOKE_VA_PASSWORD" && -n "$SMOKE_RECRUITER_EMAIL" && -n "$SMOKE_RECRUITER_PASSWORD" && -n "$SMOKE_ADMIN_EMAIL" && -n "$SMOKE_ADMIN_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::Authenticated dashboard QA is required. Configure the SMOKE_* repository secrets, including SMOKE_SUPABASE_SERVICE_ROLE_KEY and the admin test account."
            exit 1
          fi
      - if: steps.credentials.outputs.enabled == 'true'
        run: npm ci
      - if: steps.credentials.outputs.enabled == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.credentials.outputs.enabled == 'true'
        name: Build authenticated dashboard test app
        run: npm run build
      - if: steps.credentials.outputs.enabled == 'true'
        name: Start local Next.js server
        shell: bash
        run: |
          npm start -- -H 127.0.0.1 -p 3000 > /tmp/dashboard-visual-next.log 2>&1 &
          echo $! > /tmp/dashboard-visual-next.pid
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/auth/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/dashboard-visual-next.log
          exit 1
      - name: Capture authenticated dashboards
        if: steps.credentials.outputs.enabled == 'true'
        env:
          VISUAL_BASE_URL: http://127.0.0.1:3000
        run: node scripts/authenticated-dashboard-visual.mjs
      - name: Stop local Next.js server
        if: always() && steps.credentials.outputs.enabled == 'true'
        shell: bash
        run: |
          if [[ -f /tmp/dashboard-visual-next.pid ]]; then
            kill "$(cat /tmp/dashboard-visual-next.pid)" || true
          fi
          if [[ -f /tmp/dashboard-visual-next.log ]]; then
            tail -n 200 /tmp/dashboard-visual-next.log
          fi
      - name: Upload dashboard screenshots
        if: always() && steps.credentials.outputs.enabled == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: dashboard-visual-${{ github.event.pull_request.number }}
          path: artifacts/dashboard-visual
          if-no-files-found: warn
          retention-days: 14
