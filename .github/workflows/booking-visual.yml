name: Public booking visual QA

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/app/book-client-call/**"
      - "src/components/client-booking-form.tsx"
      - "src/lib/discovery-booking.ts"
      - "scripts/public-booking-visual.mjs"
      - ".github/workflows/booking-visual.yml"

permissions:
  contents: read

concurrency:
  group: booking-visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshots:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run live Google Calendar production smoke
        if: github.head_ref == 'test/live-google-calendar-production-smoke-2'
        run: node scripts/live-google-calendar-production-smoke-2.mjs
      - name: Start isolated booking preview
        env:
          BOOKING_VISUAL_FIXTURE: "1"
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/booking-preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/book-client-call > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/booking-preview.log
          exit 1
      - name: Capture public booking states
        env:
          VISUAL_BASE_URL: http://127.0.0.1:3000
        run: node scripts/public-booking-visual.mjs
      - name: Upload booking screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: booking-visual-${{ github.event.pull_request.number }}
          path: artifacts/booking-visual
          if-no-files-found: error
          retention-days: 14
