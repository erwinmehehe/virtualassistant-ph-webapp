<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Virtual Assistant proposal sample</title>
<desc id="desc">A job-specific VA proposal showing the employer need, proof, plan, availability and one clear question.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#444ce7"/><stop offset="1" stop-color="#7a5af8"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity=".12"/></filter>
</defs>
<rect width="1200" height="675" rx="36" fill="url(#bg)"/>
<circle cx="1100" cy="88" r="128" fill="#ddd6fe" opacity=".55"/>
<circle cx="90" cy="590" r="140" fill="#dbeafe" opacity=".58"/>
<g filter="url(#shadow)"><rect x="112" y="76" width="976" height="525" rx="30" fill="#fff"/></g>
<rect x="112" y="76" width="976" height="65" rx="30" fill="#f8fafc"/>
<circle cx="151" cy="108" r="7" fill="#cbd5e1"/><circle cx="176" cy="108" r="7" fill="#cbd5e1"/><circle cx="201" cy="108" r="7" fill="#cbd5e1"/>
<text x="600" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#667085">VA application message</text>
<rect x="152" y="174" width="360" height="366" rx="24" fill="url(#accent)"/>
<text x="186" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#e0e7ff">THE JOB</text>
<text x="186" y="254" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#fff">Inbox + calendar</text>
<text x="186" y="286" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#fff">support</text>
<rect x="186" y="326" width="276" height="42" rx="21" fill="#fff" opacity=".14"/>
<text x="324" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">AU business hours</text>
<text x="186" y="418" font-family="Arial, sans-serif" font-size="14" fill="#e0e7ff">The proposal should answer:</text>
<text x="186" y="450" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">Can you own this workflow?</text>
<text x="186" y="480" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">What proves it?</text>
<text x="186" y="510" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">What happens next?</text>
<text x="574" y="196" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#444ce7">PROPOSAL STRUCTURE</text>
<g font-family="Arial, sans-serif">
<circle cx="592" cy="245" r="17" fill="#444ce7"/><text x="592" y="251" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><text x="624" y="241" font-size="17" font-weight="700" fill="#101828">Need</text><text x="624" y="265" font-size="14" fill="#667085">Name the workflow from the job.</text>
<circle cx="592" cy="315" r="17" fill="#7a5af8"/><text x="592" y="321" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><text x="624" y="311" font-size="17" font-weight="700" fill="#101828">Proof</text><text x="624" y="335" font-size="14" fill="#667085">One relevant task, result, or example.</text>
<circle cx="592" cy="385" r="17" fill="#12b76a"/><text x="592" y="391" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><text x="624" y="381" font-size="17" font-weight="700" fill="#101828">Plan</text><text x="624" y="405" font-size="14" fill="#667085">Show how you would start the work.</text>
<circle cx="592" cy="455" r="17" fill="#f79009"/><text x="592" y="461" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text><text x="624" y="451" font-size="17" font-weight="700" fill="#101828">Practical fit</text><text x="624" y="475" font-size="14" fill="#667085">Hours, timezone, or required tool.</text>
<circle cx="592" cy="525" r="17" fill="#0284c7"/><text x="592" y="531" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text><text x="624" y="521" font-size="17" font-weight="700" fill="#101828">Question</text><text x="624" y="545" font-size="14" fill="#667085">Make the employer's reply easy.</text>
</g>
</svg>