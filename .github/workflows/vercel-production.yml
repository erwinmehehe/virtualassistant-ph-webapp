name: Vercel Production Deploy

on:
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: team_OLiGQ4QQn95gUBl5WEtzUvfD
      VERCEL_PROJECT_ID: prj_eUS8RTfbvCxDGsjhi4qLSVgAffOO
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check deployment credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured. Add it as a GitHub Actions secret before using this workflow."
            exit 1
          fi

      - name: Checkout validated commit
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull production environment
        run: npx --yes vercel@59.20.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        run: npx --yes vercel@59.20.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifact
        run: npx --yes vercel@59.20.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
