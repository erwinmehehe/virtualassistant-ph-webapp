name: Authenticated dashboard visual QA

on:
  push:
    branches: [main]
    paths:
      - "src/app/workspace/**"
      - "src/app/dashboard-premium.css"
      - "src/components/app-*.tsx"
      - "src/components/dash-*.tsx"
      - "src/components/sales-analytics-dashboard.tsx"
      - "src/lib/sales-analytics.ts"
      - "scripts/authenticated-dashboard-visual.mjs"
      - ".github/workflows/dashboard-visual.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: dashboard-visual-${{ github.sha }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMOKE_SUPABASE_URL: ${{ secrets.SMOKE_SUPABASE_URL }}
      SMOKE_SUPABASE_ANON_KEY: ${{ secrets.SMOKE_SUPABASE_ANON_KEY }}
      SMOKE_CLIENT_EMAIL: ${{ secrets.SMOKE_CLIENT_EMAIL }}
      SMOKE_CLIENT_PASSWORD: ${{ secrets.SMOKE_CLIENT_PASSWORD }}
      SMOKE_VA_EMAIL: ${{ secrets.SMOKE_VA_EMAIL }}
      SMOKE_VA_PASSWORD: ${{ secrets.SMOKE_VA_PASSWORD }}
      SMOKE_RECRUITER_EMAIL: ${{ secrets.SMOKE_RECRUITER_EMAIL }}
      SMOKE_RECRUITER_PASSWORD: ${{ secrets.SMOKE_RECRUITER_PASSWORD }}
      SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check visual test credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$SMOKE_SUPABASE_URL" && -n "$SMOKE_SUPABASE_ANON_KEY" && -n "$SMOKE_CLIENT_EMAIL" && -n "$SMOKE_CLIENT_PASSWORD" && -n "$SMOKE_VA_EMAIL" && -n "$SMOKE_VA_PASSWORD" && -n "$SMOKE_RECRUITER_EMAIL" && -n "$SMOKE_RECRUITER_PASSWORD" && -n "$SMOKE_ADMIN_EMAIL" && -n "$SMOKE_ADMIN_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::Authenticated dashboard QA is required. Configure the SMOKE_* account credentials."
            exit 1
          fi
      - if: steps.credentials.outputs.enabled == 'true'
        run: npm ci
      - if: steps.credentials.outputs.enabled == 'true'
        run: npx playwright install --with-deps chromium
      - name: Wait for this main commit to reach production
        if: steps.credentials.outputs.enabled == 'true'
        id: production
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            for (let attempt = 0; attempt < 40; attempt += 1) {
              const deployments = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                per_page: 20
              });
              for (const deployment of deployments.data) {
                if (String(deployment.environment || "").toLowerCase() !== "production") continue;
                const statuses = await github.rest.repos.listDeploymentStatuses({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  per_page: 20
                });
                const ready = statuses.data.find((status) => status.state === "success" && status.environment_url);
                if (ready) {
                  core.setOutput("url", ready.environment_url);
                  return;
                }
                const failed = statuses.data.find((status) => ["failure", "error"].includes(status.state));
                if (failed) core.warning(`Production deployment is currently ${failed.state}. Waiting for another status.`);
              }
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            core.setFailed("No successful production deployment was found for this main commit.");
      - name: Capture authenticated dashboards
        if: steps.credentials.outputs.enabled == 'true'
        env:
          VISUAL_BASE_URL: ${{ steps.production.outputs.url }}
        run: node scripts/authenticated-dashboard-visual.mjs
      - name: Upload dashboard screenshots
        if: always() && steps.credentials.outputs.enabled == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: dashboard-visual-${{ github.sha }}
          path: artifacts/dashboard-visual
          if-no-files-found: warn
          retention-days: 14
