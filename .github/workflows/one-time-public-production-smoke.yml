name: One-time public production smoke

on:
  push:
    branches: [ops/public-production-smoke]
    paths:
      - ".github/workflows/one-time-public-production-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Diagnose public production pricing
        shell: bash
        run: |
          set -euo pipefail
          base="https://virtualassistant.com.ph"
          pricing="$(mktemp)"
          home="$(mktemp)"
          curl --fail-with-body --silent --show-error --location --max-time 30 "$base/pricing" -o "$pricing"
          curl --fail-with-body --silent --show-error --location --max-time 30 "$base/" -o "$home"

          echo "Pricing money/rate snippets:"
          grep -Eo 'USD [0-9]+/hour|\$[0-9]+|[0-9]+%' "$pricing" | sort -u | head -40 || true
          echo "Homepage rate snippets:"
          grep -Eo 'USD [0-9]+/hour|\$[0-9]+|[0-9]+%' "$home" | sort -u | head -40 || true

          grep -Fq '20%' "$pricing" || { echo 'Live pricing page is missing the canonical 20% managed margin.'; exit 1; }
          grep -Fq '$150' "$pricing" || { echo 'Live pricing page is missing the canonical $150 placement fee.'; exit 1; }
          if grep -Fq 'USD 6/hour' "$pricing" || grep -Fq 'USD 6/hour' "$home"; then
            echo 'Production still exposes stale USD 6/hour minimum pricing.'
            exit 1
          fi
          grep -Fq 'USD 5/hour' "$pricing" || { echo 'Production pricing does not currently render the canonical USD 5/hour minimum.'; exit 1; }
          echo "Canonical live pricing passed."
