name: One-time public production smoke

on:
  push:
    branches: [ops/public-production-smoke]
    paths:
      - ".github/workflows/one-time-public-production-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Inspect live pricing context
        shell: bash
        run: |
          set -euo pipefail
          base="https://virtualassistant.com.ph"
          pricing="$(mktemp)"
          home="$(mktemp)"
          curl --fail-with-body --silent --show-error --location --max-time 30 "$base/pricing" -o "$pricing"
          curl --fail-with-body --silent --show-error --location --max-time 30 "$base/" -o "$home"
          node - "$pricing" "$home" <<'NODE'
          const fs = require('fs');
          for (const [label, path, needles] of [
            ['pricing', process.argv[2], ['$5', '$150', '20%', 'USD 5/hour', 'Standard managed placements']],
            ['home', process.argv[3], ['$5', '$6', 'USD 6/hour', 'minimum', 'hour']]
          ]) {
            const raw = fs.readFileSync(path, 'utf8');
            const text = raw.replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<style[\s\S]*?<\/style>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/\s+/g, ' ');
            console.log(`--- ${label} ---`);
            for (const needle of needles) {
              const i = text.indexOf(needle);
              console.log(`${needle}: ${i >= 0 ? text.slice(Math.max(0, i - 180), i + needle.length + 260) : '<not found>'}`);
            }
          }
          NODE
