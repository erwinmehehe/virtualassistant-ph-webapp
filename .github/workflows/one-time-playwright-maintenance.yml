name: One-time Playwright security maintenance

on:
  push:
    branches: [fix/dependency-css-smoke]
    paths:
      - ".github/workflows/one-time-playwright-maintenance.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dependency-css-smoke
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Update Playwright and lockfile
        run: npm install --save-dev playwright@1.63.0
      - name: Verify full dependency audit
        run: npm audit --audit-level=high
      - name: Commit generated dependency changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Update Playwright security dependency"
          git push origin HEAD:fix/dependency-css-smoke
