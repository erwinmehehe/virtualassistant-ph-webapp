name: Encrypted production database backup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/database-backup.yml"
      - "scripts/create-encrypted-db-backup.sh"
      - "scripts/verify-encrypted-db-backup.sh"
      - "scripts/restore-test-db-backup.sh"
      - "scripts/diagnose-backup-db-url.mjs"

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      RESTORE_POSTGRES_IMAGE: supabase/postgres:17.6.1.155
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.121.0

      - name: Require backup secrets
        shell: bash
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "SUPABASE_DB_URL is not configured."; exit 1; }
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE" || { echo "BACKUP_ENCRYPTION_PASSPHRASE is not configured."; exit 1; }
          test "${#BACKUP_ENCRYPTION_PASSPHRASE}" -ge 32 || { echo "Backup encryption passphrase must be at least 32 characters."; exit 1; }

      - name: Diagnose database login without logging credentials
        run: node scripts/diagnose-backup-db-url.mjs

      - name: Create encrypted production dump
        id: backup
        shell: bash
        run: |
          chmod +x scripts/create-encrypted-db-backup.sh scripts/verify-encrypted-db-backup.sh scripts/restore-test-db-backup.sh
          backup_path="$(scripts/create-encrypted-db-backup.sh backup | tail -n 1)"
          echo "path=$backup_path" >> "$GITHUB_OUTPUT"

      - name: Verify encrypted archive
        shell: bash
        run: scripts/verify-encrypted-db-backup.sh "${{ steps.backup.outputs.path }}"

      - name: Upload encrypted off-provider artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vaph-production-db-backup-${{ github.run_id }}
          path: |
            ${{ steps.backup.outputs.path }}
            ${{ steps.backup.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Restore-test encrypted archive
        shell: bash
        run: scripts/restore-test-db-backup.sh "${{ steps.backup.outputs.path }}"

