name: SEO production crawl temporary

on:
  push:
    branches:
      - seo/google-indexing-api

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Crawl production sitemap
        env:
          SITE_URL: https://virtualassistant.com.ph
          CRAWL_CONCURRENCY: "8"
        run: node scripts/crawl-sitemap.mjs
