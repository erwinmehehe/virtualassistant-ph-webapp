name: Next 16 lockfile migration artifact (temporary)
on:
  pull_request:
    branches: [main]
  push:
    branches: [dependabot/npm_and_yarn/next-16.4.2]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: ${{ github.event_name == 'push' }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Regenerate package lock without install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev --save-exact eslint-config-next@16.4.2
      - name: Verify matching versions
        run: |
          node -e 'const p=require("./package.json"), l=require("./package-lock.json");if(p.dependencies.next!=="16.4.2"||p.devDependencies["eslint-config-next"]!=="16.4.2"||l.packages["node_modules/eslint-config-next"].version!=="16.4.2")process.exit(1)'
      - name: Upload Next16 manifest and lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next16-eslint-locked-${{ github.run_id }}
          path: |
            package.json
            package-lock.json
          retention-days: 7
      - name: Commit generated lockfile on trusted branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/dependabot/npm_and_yarn/next-16.4.2'
        run: |
          git config user.name "VAPH dependency lockfile bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(next16): lock matching eslint-config-next 16.4.2"
            git push origin HEAD:refs/heads/dependabot/npm_and_yarn/next-16.4.2
          fi
