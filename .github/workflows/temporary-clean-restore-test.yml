# Temporary isolated raw-archive recovery experiment; no production mutations.
name: TEMP VAPH clean full-archive restore
on:
  push:
    branches: [fix/backup-secret-safe-diagnostic-2026-10-15]
    paths: [".github/workflows/temporary-clean-restore-test.yml"]
permissions:
  contents: read
  actions: read
concurrency:
  group: vaph-temporary-clean-restore
  cancel-in-progress: false
jobs:
  clean-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Retrieve pre-existing complete PostgreSQL encrypted dump
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vaph-production-db-backup-38726590924
          path: raw-artifact
          run-id: 38726590924
          github-token: ${{ github.token }}
      - name: Decrypt, erase disposable target schemas and restore entire archive
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          stage="$(mktemp -d)"
          container="vaph-clean-restore-$GITHUB_RUN_ID"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; rm -rf "$stage"; }
          trap cleanup EXIT
          archive="$(find raw-artifact -maxdepth 1 -name '*.dump.enc' -print -quit)"
          test -n "$archive"
          checksum="$(awk 'NR==1 {print $1}' "$archive.sha256")"
          actual="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          [[ "$checksum" == "$actual" ]] || { echo "Encrypted checksum mismatch"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE -in "$archive" -out "$stage/source.dump"
          docker run -d --name "$container" -e POSTGRES_PASSWORD=postgres \
            -v "$stage:/backup:ro" supabase/postgres:17.6.1.155 >/dev/null
          for _ in $(seq 1 90); do
            if docker exec "$container" pg_isready -U postgres -d postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          for _ in $(seq 1 90); do
            if docker exec -e PGPASSWORD=postgres "$container" \
              psql -X -h 127.0.0.1 -U supabase_admin -d postgres -Atc "SELECT 1" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -e PGPASSWORD=postgres "$container" \
            psql -X -h 127.0.0.1 -U supabase_admin -d postgres \
            -v ON_ERROR_STOP=1 -Atc \
            "SELECT format('DROP SCHEMA IF EXISTS %I CASCADE;', nspname) FROM pg_namespace WHERE nspname NOT LIKE 'pg_%' AND nspname NOT IN ('information_schema');" \
            > "$stage/clean.sql"
          docker exec -e PGPASSWORD=postgres "$container" \
            psql -X -h 127.0.0.1 -U supabase_admin -d postgres \
            -v ON_ERROR_STOP=1 -f /backup/clean.sql > "$stage/clean.log" 2>&1 \
            || { echo "Failed to reset disposable target schemas. Live database unchanged."; exit 1; }
          remaining="$(docker exec -e PGPASSWORD=postgres "$container" psql -X -h 127.0.0.1 -U supabase_admin -d postgres -Atc "SELECT coalesce(string_agg(nspname, ', ' ORDER BY nspname),'none') FROM pg_namespace WHERE nspname NOT LIKE 'pg_%' AND nspname <> 'information_schema';")"
          echo "Schema catalog after disposable reset: $remaining"
          echo "Disposable-only database schemas reset. Beginning complete encrypted-archive restore."
          if ! docker exec -e PGPASSWORD=postgres "$container" \
            pg_restore --host=127.0.0.1 --username=supabase_admin --dbname=postgres \
              --no-owner --no-privileges --single-transaction --exit-on-error \
              /backup/source.dump > "$stage/restore.log" 2>&1; then
            echo "Full raw-archive restore failed in disposable target. No production changes."
            python3 - "$stage/restore.log" <<'PY'
            import pathlib, re, sys
            for line in pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines():
                if "ERROR:" not in line: continue
                msg=line.split("ERROR:",1)[1].strip()
                msg=re.sub(r'"[^"]*"', '"[identifier]"', msg)
                msg=re.sub(r"'[^']*'", "'[value]'", msg)
                msg=re.sub(r"\b[\w.+-]+@[\w.-]+\.\w+\b", "[email]", msg)
                print("First sanitized PostgreSQL ERROR:",msg[:190])
                break
            PY
            for schema in auth storage realtime public extensions cron net vault graphql_public; do
              if grep -Fq "schema \"$schema\" already exists" "$stage/restore.log"; then
                echo "Conflicting disposable restore schema: $schema"
              fi
            done
            for pattern in 'extension' 'schema' 'relation' 'role' 'permission' 'function' 'type' 'already exists' 'does not exist'; do
              if grep -qi "$pattern" "$stage/restore.log"; then echo "Failure category: $pattern"; fi
            done
            exit 1
          fi
          echo "Full raw-archive import finished."
          result="$(docker exec -e PGPASSWORD=postgres "$container" psql -X -h 127.0.0.1 -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -Atc \
            "SELECT (to_regclass('public.lead_intake') IS NOT NULL)::text || '|' || (to_regclass('auth.users') IS NOT NULL)::text || '|' || (SELECT count(*)>0 FROM pg_policies WHERE schemaname='public')::text;")"
          [[ "$result" == "true|true|true" ]] || { echo "Application schema or RLS recovery proof incomplete"; exit 1; }
          echo "Isolated FULL-ARCHIVE RESTORE and representative app/Auth/RLS checks passed."
