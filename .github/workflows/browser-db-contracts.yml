name: Browser and database contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-db-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-db-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_CLI_VERSION: "2.113.0"
      E2E_PASSWORD: "E2e-Only!Pass12345"
      E2E_BASE_URL: "http://127.0.0.1:3000"
      NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Verify pinned Supabase CLI
        run: npx -y supabase@${SUPABASE_CLI_VERSION} --version

      - name: Rebuild local database from baseline and migrations
        shell: bash
        run: bash scripts/bootstrap-e2e-local-supabase.sh

      - name: Export local Supabase application environment
        shell: bash
        run: |
          set -a
          source .supabase-e2e.env
          set +a
          : "${API_URL:?Supabase API_URL missing}"
          : "${ANON_KEY:?Supabase ANON_KEY missing}"
          : "${SERVICE_ROLE_KEY:?Supabase SERVICE_ROLE_KEY missing}"
          : "${DB_URL:?Supabase DB_URL missing}"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "LOCAL_SUPABASE_DB_URL=${DB_URL}"
          } >> "$GITHUB_ENV"

      - name: Verify RLS and server-only database contracts
        shell: bash
        run: psql "$LOCAL_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f scripts/verify-e2e-db-contracts.sql

      - name: Seed isolated browser identities
        run: node scripts/seed-e2e-users.mjs

      - name: Seed fictional hiring proposals and approved VA (loopback only)
        run: node scripts/seed-e2e-hiring-fixtures.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Run this gate while the disposable database is fresh; unrelated
      # browser journeys must not affect authentication rate-limit state.
      - name: Isolated Turnstile-enabled authentication gate
        env:
          VAPH_AUTH_GATE: "true"
          # Cloudflare's published always-pass test credentials are public fixtures.
          # CI only uses them in this disposable loopback-only authentication gate.
          # An explicit override must still equal the official test pair or the gate fails closed.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.VAPH_AUTH_E2E_TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
          TURNSTILE_SECRET_KEY: ${{ secrets.VAPH_AUTH_E2E_TURNSTILE_SECRET_KEY || '1x0000000000000000000000000000000AA' }}
        run: npx playwright test e2e/auth-turnstile-gate.spec.ts --project=chromium --workers=1 --retries=0

      - name: Run browser journeys
        run: npx playwright test

      - name: Upload all-roles smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vaph-all-roles-smoke-${{ github.run_id }}
          path: artifacts/all-roles-smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Retain training transactional UAT screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vaph-training-uat-${{ github.run_id }}
          path: artifacts/training-uat/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload isolated responsive screenshots
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-responsive-${{ github.run_id }}
          path: test-results/workspace-screenshots/
          if-no-files-found: ignore
          retention-days: 1

      - name: Retain isolated chat and Auth-ban acceptance summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vaph-chat-auth-uat-${{ github.run_id }}
          path: artifacts/chat-auth-uat/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-db-contracts-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: npx -y supabase@${SUPABASE_CLI_VERSION} stop --no-backup
