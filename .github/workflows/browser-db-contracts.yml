name: Browser and database contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-db-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-db-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_CLI_VERSION: "2.113.0"
      E2E_PASSWORD: "E2e-Only!Pass12345"
      E2E_BASE_URL: "http://127.0.0.1:3000"
      NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Verify pinned Supabase CLI
        run: npx -y supabase@${SUPABASE_CLI_VERSION} --version

      - name: Rebuild local database from baseline and migrations
        shell: bash
        run: bash scripts/bootstrap-e2e-local-supabase.sh

      - name: Export local Supabase application environment
        shell: bash
        run: |
          set -a
          source .supabase-e2e.env
          set +a
          : "${API_URL:?Supabase API_URL missing}"
          : "${ANON_KEY:?Supabase ANON_KEY missing}"
          : "${SERVICE_ROLE_KEY:?Supabase SERVICE_ROLE_KEY missing}"
          : "${DB_URL:?Supabase DB_URL missing}"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "LOCAL_SUPABASE_DB_URL=${DB_URL}"
          } >> "$GITHUB_ENV"

      - name: Verify RLS and server-only database contracts
        shell: bash
        run: psql "$LOCAL_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f scripts/verify-e2e-db-contracts.sql

      - name: Seed isolated browser identities
        run: node scripts/seed-e2e-users.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser journeys
        run: npx playwright test

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-db-contracts-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: npx -y supabase@${SUPABASE_CLI_VERSION} stop --no-backup
