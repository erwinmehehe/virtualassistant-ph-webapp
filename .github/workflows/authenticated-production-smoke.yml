name: Authenticated production smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Bootstrap passwordless smoke sessions
        env:
          SMOKE_BASE_URL: https://virtualassistant.com.ph
        run: node scripts/bootstrap-github-smoke.mjs
      - name: Run authenticated production smoke
        env:
          SMOKE_BASE_URL: https://virtualassistant.com.ph
        run: node scripts/authenticated-production-smoke.mjs
