name: Authenticated production smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Bootstrap passwordless smoke sessions
        env:
          SMOKE_BASE_URL: https://virtualassistant.com.ph
        run: node scripts/bootstrap-github-smoke.mjs
      - name: Run authenticated production smoke
        env:
          SMOKE_BASE_URL: https://virtualassistant.com.ph
        run: node scripts/authenticated-production-smoke.mjs
