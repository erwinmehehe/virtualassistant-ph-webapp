<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1000" width="360" height="1000" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">Mobile inbox triage flow</title>
<desc id="flow-desc">Six vertically stacked steps: capture a message, verify its source, prioritize by consequence, check your authority, take a safe action or escalate, then document the named owner and next checkpoint. Urgency never grants permission.</desc>
<rect width="360" height="1000" rx="16" fill="#f8faff"/>
<rect x="1" y="1" width="358" height="998" rx="15" fill="none" stroke="#c7d2fe" stroke-width="2"/>
<g font-family="system-ui,Arial,sans-serif">
<text x="18" y="38" fill="#172554" font-size="20" font-weight="700">From inbox to handoff</text>
<text x="18" y="60" fill="#475569" font-size="12">Fictional VAPH Foundations V2 exercise</text>
</g>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
</defs>
<g font-family="system-ui,Arial,sans-serif">
<rect x="16" y="88" width="328" height="106" rx="12" fill="#fff" stroke="#9eacf8" stroke-width="1.5"/>
<circle cx="42" cy="114" r="14" fill="#4f46e5"/><text x="42" y="119" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<text x="67" y="121" fill="#172554" font-size="17" font-weight="700">Capture</text>
<text x="30" y="153" fill="#334155" font-size="13">Preserve message ID, source and time.</text>
<text x="30" y="175" fill="#334155" font-size="13">Do not lose the original context.</text>
<path d="M180 195v18" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
<rect x="16" y="216" width="328" height="106" rx="12" fill="#fff" stroke="#9eacf8" stroke-width="1.5"/>
<circle cx="42" cy="242" r="14" fill="#4f46e5"/><text x="42" y="247" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text>
<text x="67" y="249" fill="#172554" font-size="17" font-weight="700">Verify</text>
<text x="30" y="281" fill="#334155" font-size="13">Use approved records, not a claim alone.</text>
<text x="30" y="303" fill="#334155" font-size="13">Identify what remains unknown.</text>
<path d="M180 323v18" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
<rect x="16" y="344" width="328" height="106" rx="12" fill="#fff" stroke="#9eacf8" stroke-width="1.5"/>
<circle cx="42" cy="370" r="14" fill="#4f46e5"/><text x="42" y="375" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">3</text>
<text x="67" y="377" fill="#172554" font-size="17" font-weight="700">Prioritize</text>
<text x="30" y="409" fill="#334155" font-size="13">Consequence, risk and real deadline.</text>
<text x="30" y="431" fill="#334155" font-size="13">Not just arrival order or tone.</text>
<path d="M180 451v18" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
<rect x="16" y="472" width="328" height="106" rx="12" fill="#fff" stroke="#c4b5fd" stroke-width="1.5"/>
<circle cx="42" cy="498" r="14" fill="#7c3aed"/><text x="42" y="503" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">4</text>
<text x="67" y="505" fill="#172554" font-size="17" font-weight="700">Check authority</text>
<text x="30" y="537" fill="#334155" font-size="13">Do you have permission to decide?</text>
<text x="30" y="559" fill="#334155" font-size="13">If not, stop and ask the right owner.</text>
<path d="M180 579v18" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
<rect x="16" y="600" width="328" height="106" rx="12" fill="#fff" stroke="#c4b5fd" stroke-width="1.5"/>
<circle cx="42" cy="626" r="14" fill="#7c3aed"/><text x="42" y="631" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">5</text>
<text x="67" y="633" fill="#172554" font-size="17" font-weight="700">Take safe action</text>
<text x="30" y="665" fill="#334155" font-size="13">Draft, log, verify or escalate.</text>
<text x="30" y="687" fill="#334155" font-size="13">No unapproved promises or changes.</text>
<path d="M180 707v18" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
<rect x="16" y="728" width="328" height="106" rx="12" fill="#fff" stroke="#99d5c5" stroke-width="1.5"/>
<circle cx="42" cy="754" r="14" fill="#0d9488"/><text x="42" y="759" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">6</text>
<text x="67" y="761" fill="#172554" font-size="17" font-weight="700">Track and hand off</text>
<text x="30" y="793" fill="#334155" font-size="13">Name owner, deadline, checkpoint</text>
<text x="30" y="815" fill="#334155" font-size="13">and evidence; verify before closing.</text>
<rect x="16" y="862" width="328" height="87" rx="11" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="180" y="894" fill="#312e81" text-anchor="middle" font-size="15" font-weight="700">Urgency does not grant authority</text>
<text x="180" y="922" fill="#3730a3" text-anchor="middle" font-size="12">Unapproved or risky? Hold and escalate.</text>
<text x="180" y="976" fill="#52617a" text-anchor="middle" font-size="11">Original VAPH illustration • synthetic case</text>
</g>
</svg>

