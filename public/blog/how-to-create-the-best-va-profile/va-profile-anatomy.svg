<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Best Virtual Assistant profile checklist</title>
<desc id="desc">Six-part checklist showing positioning, experience, skills, tools, proof and availability.</desc>
<rect width="960" height="600" rx="32" fill="#f8fafc"/>
<text x="64" y="72" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#0f172a">Anatomy of a strong VA profile</text>
<text x="64" y="105" font-family="Arial, sans-serif" font-size="16" fill="#64748b">Make every section support the same professional story.</text>
<g font-family="Arial, sans-serif">
<g transform="translate(64 148)"><rect width="250" height="130" rx="20" fill="#fff" stroke="#dbeafe"/><circle cx="38" cy="38" r="20" fill="#2563eb"/><text x="38" y="44" text-anchor="middle" fill="#fff" font-weight="700">1</text><text x="72" y="35" font-size="17" font-weight="700" fill="#0f172a">Positioning</text><text x="24" y="78" font-size="14" fill="#475569">One clear role or specialty</text><text x="24" y="101" font-size="14" fill="#475569">that matches your target jobs.</text></g>
<g transform="translate(355 148)"><rect width="250" height="130" rx="20" fill="#fff" stroke="#ddd6fe"/><circle cx="38" cy="38" r="20" fill="#4f46e5"/><text x="38" y="44" text-anchor="middle" fill="#fff" font-weight="700">2</text><text x="72" y="35" font-size="17" font-weight="700" fill="#0f172a">Experience</text><text x="24" y="78" font-size="14" fill="#475569">Describe tasks and workflows,</text><text x="24" y="101" font-size="14" fill="#475569">not just old job titles.</text></g>
<g transform="translate(646 148)"><rect width="250" height="130" rx="20" fill="#fff" stroke="#d1fae5"/><circle cx="38" cy="38" r="20" fill="#059669"/><text x="38" y="44" text-anchor="middle" fill="#fff" font-weight="700">3</text><text x="72" y="35" font-size="17" font-weight="700" fill="#0f172a">Skills</text><text x="24" y="78" font-size="14" fill="#475569">Prioritize skills you can</text><text x="24" y="101" font-size="14" fill="#475569">demonstrate in an interview.</text></g>
<g transform="translate(64 318)"><rect width="250" height="130" rx="20" fill="#fff" stroke="#fde68a"/><circle cx="38" cy="38" r="20" fill="#d97706"/><text x="38" y="44" text-anchor="middle" fill="#fff" font-weight="700">4</text><text x="72" y="35" font-size="17" font-weight="700" fill="#0f172a">Tools</text><text x="24" y="78" font-size="14" fill="#475569">List software you have used</text><text x="24" y="101" font-size="14" fill="#475569">inside real workflows.</text></g>
<g transform="translate(355 318)"><rect width="250" height="130" rx="20" fill="#fff" stroke="#fecdd3"/><circle cx="38" cy="38" r="20" fill="#e11d48"/><text x="38" y="44" text-anchor="middle" fill="#fff" font-weight="700">5</text><text x="72" y="35" font-size="17" font-weight="700" fill="#0f172a">Proof</text><text x="24" y="78" font-size="14" fill="#475569">Portfolio samples, results,</text><text x="24" y="101" font-size="14" fill="#475569">or labelled practice projects.</text></g>
<g transform="translate(646 318)"><rect width="250" height="130" rx="20" fill="#fff" stroke="#bae6fd"/><circle cx="38" cy="38" r="20" fill="#0284c7"/><text x="38" y="44" text-anchor="middle" fill="#fff" font-weight="700">6</text><text x="72" y="35" font-size="17" font-weight="700" fill="#0f172a">Availability</text><text x="24" y="78" font-size="14" fill="#475569">Accurate weekly hours and</text><text x="24" y="101" font-size="14" fill="#475569">realistic time-zone overlap.</text></g>
</g>
<rect x="64" y="500" width="832" height="52" rx="16" fill="#0f172a"/>
<text x="480" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">If one section tells a different story, fix the mismatch before you apply.</text>
</svg>