name: One-time dependency and CSS maintenance

on:
  push:
    branches: [fix/dependency-css-smoke]
    paths:
      - ".github/workflows/one-time-maintenance.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dependency-css-smoke
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Update Svix and lockfile
        run: npm install svix@1.99.1 --save
      - name: Normalize CSS end alignment
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'src/app/blog-editorial.css',
            'src/app/cro-hiring-tools.css',
            'src/app/globals.css',
            'src/app/premium-home.css',
          ];
          for (const file of files) {
            const before = fs.readFileSync(file, 'utf8');
            const after = before
              .replace(/align-items:\s*end\b/g, 'align-items: flex-end')
              .replace(/justify-content:\s*end\b/g, 'justify-content: flex-end');
            if (after !== before) fs.writeFileSync(file, after);
          }
          NODE
      - name: Commit generated maintenance changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/app/blog-editorial.css src/app/cro-hiring-tools.css src/app/globals.css src/app/premium-home.css
          git commit -m "Update Svix and remove CSS compatibility warnings"
          git push origin HEAD:fix/dependency-css-smoke
