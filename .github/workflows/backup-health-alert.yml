name: Production backup health alert

on:
  workflow_run:
    workflows:
      - Encrypted production database backup
    types: [completed]
  schedule:
    - cron: "44 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: vaph-production-backup-health
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Monitor encrypted dump and isolated restore health
        run: node scripts/backup-health-monitor.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
