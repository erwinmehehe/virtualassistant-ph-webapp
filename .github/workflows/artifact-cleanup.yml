name: Actions artifact cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artifact-cleanup.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete artifacts older than 7 days
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
            let scanned = 0;
            let deleted = 0;
            let bytesDeleted = 0;

            for await (const response of github.paginate.iterator(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            )) {
              for (const artifact of response.data) {
                scanned += 1;
                const createdAt = Date.parse(artifact.created_at || "");
                if (!Number.isFinite(createdAt) || createdAt >= cutoff) continue;

                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                deleted += 1;
                bytesDeleted += Number(artifact.size_in_bytes || 0);
                core.info(`Deleted ${artifact.name} (${artifact.id})`);
              }
            }

            core.summary
              .addHeading("Artifact cleanup")
              .addTable([
                [{ data: "Metric", header: true }, { data: "Value", header: true }],
                ["Scanned", String(scanned)],
                ["Deleted", String(deleted)],
                ["Freed", `${(bytesDeleted / 1024 / 1024).toFixed(1)} MB`],
              ])
              .write();
